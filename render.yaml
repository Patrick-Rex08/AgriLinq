services:
  - type: web
    name: agrilink-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: "AgriLink API"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      # Set DATABASE_URL to a remote PostgreSQL connection string (e.g. Neon, Supabase, or Render Postgres)
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: agrilink-db
      #     property: connectionString
